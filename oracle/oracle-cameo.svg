<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 380" role="img" aria-label="Оракул: камея с профилем пифии в лавровом венке">
  <defs>
    <path id="arc" d="M 44 200 A 116 138 0 0 1 276 200"/>
    <clipPath id="oval"><ellipse cx="160" cy="200" rx="98" ry="120"/></clipPath>
    <symbol id="leaf" viewBox="-6 -14 12 28" overflow="visible"><path d="M0 -13 C 6 -6 6 6 0 13 C -6 6 -6 -6 0 -13 Z"/></symbol>
  </defs>

  <!-- медальон: двойная золотая рамка, как обложка сайта -->
