    <path d="M 194 245 C 192 256 194 268 198 280" fill="none" stroke="#D9CFB8" stroke-width="1.2"/>

    <!-- узел волос -->
    <ellipse cx="114" cy="176" rx="17" ry="21" fill="#EFE8D6" stroke="#C9B27A" stroke-width="1"/>
    <path d="M 102 168 C 110 158 122 160 127 170 M 100 180 C 110 172 122 174 127 184 M 104 190 C 112 184 120 186 124 194" fill="none" stroke="#C9B27A" stroke-width="1.1"/>
