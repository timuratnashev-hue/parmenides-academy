  <ellipse cx="160" cy="200" rx="141" ry="165" fill="none" stroke="#97783C" stroke-width="1.2"/>
  <ellipse cx="160" cy="200" rx="104" ry="126" fill="#2C4A38" stroke="#97783C" stroke-width="1.4"/>

  <!-- надпись по дуге: «Познай самого себя» -->
  <text font-family="'Old Standard TT', 'EB Garamond', Georgia, serif" font-size="15" letter-spacing="6" fill="#97783C">
    <textPath href="#arc" xlink:href="#arc" startOffset="50%" text-anchor="middle">ΓΝΩΘΙ · ΣΑΥΤΟΝ</textPath>
  </text>
  <text x="160" y="356" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="18" fill="#97783C">❈</text>

  <g clip-path="url(#oval)">
