      <g transform="translate(151 135) rotate(16)"><use href="#leaf" xlink:href="#leaf" x="-6" y="-14" width="12" height="28"/></g>
      <g transform="translate(166 129) rotate(4)"><use href="#leaf" xlink:href="#leaf" x="-6" y="-14" width="12" height="28"/></g>
